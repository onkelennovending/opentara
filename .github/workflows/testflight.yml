# Fork-only: signed archive of OpenTara for the Onkel Enno team (3P3KVS4BZK) and upload to
# TestFlight. Signing is manual with the team's distribution certificate and an App Store
# profile (both created via the App Store Connect API, see TESTFLIGHT.md); the upload
# authenticates with an App Store Connect API key. Runs on pushes to main, on demand, and
# weekly on a schedule: the scheduled run uploads only when the newest valid TestFlight build
# is 80+ days old (builds expire after 90), so testers always have a working build.
# Without the secrets the signed job is skipped with a notice, so the fork CI stays green and
# the unsigned .ipa from the "Build" workflow remains the fallback.
name: TestFlight

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "source.json"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/testflight/*.py"
      - ".github/testflight/*.sh"
      - ".github/testflight/last-upload.txt"
  schedule:
    # Mondays 05:17 UTC. GitHub disables schedules after 60 days without a push; the
    # marker commit after each upload keeps the repository active.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      only_if_due:
        description: "Upload only when the newest valid build is 80+ days old (what the weekly schedule does)"
        type: boolean
        default: false

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check App Store Connect secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      upload: ${{ steps.due.outputs.upload || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          P12: ${{ secrets.ASC_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.ASC_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.ASC_PROVISIONING_PROFILE }}
        run: |
          missing=""
          [ -n "$KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$PRIVATE_KEY" ] || missing="$missing ASC_PRIVATE_KEY"
          [ -n "$P12" ] || missing="$missing ASC_DIST_P12"
          [ -n "$P12_PASSWORD" ] || missing="$missing ASC_DIST_P12_PASSWORD"
          [ -n "$PROFILE" ] || missing="$missing ASC_PROVISIONING_PROFILE"
          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All signing and App Store Connect secrets present – the signed TestFlight job will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=TestFlight upload skipped::Missing repository secrets:$missing (see TESTFLIGHT.md). The unsigned OpenTara-unsigned.ipa from the Build workflow remains available."
            {
              echo "### TestFlight upload skipped"
              echo
              echo "Missing repository secrets: \`$missing\` (see TESTFLIGHT.md)."
              echo "Fallback: the unsigned \`OpenTara-unsigned.ipa\` artifact of the **Build** workflow (SideStore/AltStore)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Is a fresh build due? (schedule, or manual run with only_if_due)
        id: due
        if: steps.check.outputs.configured == 'true' && (github.event_name == 'schedule' || inputs.only_if_due == true)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 -m pip install -q pyjwt cryptography requests
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          python3 .github/testflight/asc.py due "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$KEY" | tee due.txt
          rm -f "$KEY"
          if grep -q "nothing to do" due.txt; then
            echo "::notice title=TestFlight up to date::$(grep 'newest valid build' due.txt)"
            { echo "### TestFlight up to date"; echo; grep 'newest valid build' due.txt; } >> "$GITHUB_STEP_SUMMARY"
          fi

  testflight:
    name: Signed archive → TestFlight
    needs: preflight
    if: needs.preflight.outputs.configured == 'true' && needs.preflight.outputs.upload == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: 3P3KVS4BZK
      BUNDLE_ID: com.onkelenno.opentara
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version

      - name: Install App Store Connect API key
        id: key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          KEY="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          grep -q "BEGIN PRIVATE KEY" "$KEY" || { echo "::error::ASC_PRIVATE_KEY is neither the .p8 text nor its base64"; exit 1; }
          echo "path=$KEY" >> "$GITHUB_OUTPUT"

      - name: Install distribution certificate and provisioning profile
        id: signing
        env:
          ASC_DIST_P12: ${{ secrets.ASC_DIST_P12 }}
          ASC_DIST_P12_PASSWORD: ${{ secrets.ASC_DIST_P12_PASSWORD }}
          ASC_PROVISIONING_PROFILE: ${{ secrets.ASC_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/opentara.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Apple WWDR intermediate (G3) – issuer of certificates created today; needed for a full chain.
          curl -sSfL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security || true

          printf '%s' "$ASC_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$ASC_DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "Signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN"

          printf '%s' "$ASC_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/opentara.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/opentara.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          EXPIRES=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/opentara.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Profile '$NAME' ($UUID), expires $EXPIRES"
          {
            echo "keychain=$KEYCHAIN"
            echo "profile_name=$NAME"
            echo "profile_uuid=$UUID"
          } >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/dist.p12"

      - name: Archive (manual signing, iPhone Distribution)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project OpenScaleIOS.xcodeproj \
            -scheme OpenScaleIOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/OpenTara.xcarchive \
            -xcconfig .github/testflight/OnkelEnno.xcconfig \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.signing.outputs.profile_name }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${{ steps.signing.outputs.keychain }}" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            2>&1 | tee xcodebuild-archive.log

      - name: Upload to App Store Connect (TestFlight)
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>iPhone Distribution</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${{ steps.signing.outputs.profile_name }}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/OpenTara.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -authenticationKeyPath "${{ steps.key.outputs.path }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee xcodebuild-export.log

      - name: Summary
        run: |
          VERSION=$(plutil -extract CFBundleShortVersionString raw build/OpenTara.xcarchive/Products/Applications/OpenScaleIOS.app/Info.plist 2>/dev/null || echo "?")
          {
            echo "### Uploaded to TestFlight"
            echo
            echo "- Bundle id: \`${BUNDLE_ID}\`, team \`${TEAM_ID}\`, profile \`${{ steps.signing.outputs.profile_name }}\`"
            echo "- Version ${VERSION}, build ${{ github.run_number }}"
            echo "- App Store Connect processes the build for a few minutes, then it appears under *TestFlight → iOS builds* and reaches the internal testers."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record the upload (marker commit keeps the weekly schedule alive)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'build %s uploaded %s from %s (%s)\n' "${{ github.run_number }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.sha }}" "${{ github.event_name }}" > .github/testflight/last-upload.txt
          git add .github/testflight/last-upload.txt
          git commit -m "TestFlight: build ${{ github.run_number }} uploaded [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            xcodebuild-archive.log
            xcodebuild-export.log
          if-no-files-found: ignore

      - name: Remove key material
        if: always()
        run: |
          rm -f "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          [ -n "${{ steps.signing.outputs.keychain }}" ] && security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
          [ -n "${{ steps.signing.outputs.profile_uuid }}" ] && rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${{ steps.signing.outputs.profile_uuid }}.mobileprovision" || true
